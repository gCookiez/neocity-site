<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hungry Dev Blog</title>
    <meta name="title" content="Hungry Dev Blog">
    <meta name="description"
        content="Personal Website Blog for a Hungry Dev. Experimental web projects are developed here. Personal Portfolio">
    <meta name="keywords"
        content="JavaScript, HTML, CSS, Node.js, Linux, Portfolio, neocities, Programming, Blog, Experiment">
    <link id="preload-js" rel="preload" href="./critical.js" as="script">
    <link id="burger-load" rel="preload" href="./sys/loading.png" as="image" type="image/png" />
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://epiccity.nekoweb.org/ring//onionring - small.css">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const preloadLink = document.getElementById('preload-js');
            
            function executeScript() {
                const script = document.createElement('script');
                script.src = preloadLink.href;
                script.async = false;
                document.head.appendChild(script)
            }
            
                executeScript();
        });


    </script>

</head>

<body class="preload">
    <header class="meta">
